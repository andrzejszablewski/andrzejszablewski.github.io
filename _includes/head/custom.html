{% include base_path %}

<!-- start custom head snippets -->

<link rel="shortcut icon" href="/images/favicon.ico?v=M44lzPylqQ">
<meta name="theme-color" content="#F5E6D3">
<script>
  // Light theme by default; dark only once the visitor picks it with the masthead toggle.
  // Runs before the page renders so a remembered dark choice doesn't flash light first.
  try {
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", "#2a1f19");
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- end custom head snippets -->
