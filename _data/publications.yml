# `figure` is the entry's key figure (usually Figure 1), shown when the list is included with figures=true.
# `note` adds a short line under the venue; the year is only printed when the venue doesn't already contain it.
# `posts` (blog posts, newest first) use the same fields, with `url` and `date` instead of `year`;
# they are listed on the Publications page.

